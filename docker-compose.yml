services:
  wridhy:
    image: rohanmallya/wridhy:latest
    container_name: wridhy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://momoney:momoney_dev@postgres:5432/momoney_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: momoney_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: momoney
      POSTGRES_PASSWORD: momoney_dev
      POSTGRES_DB: momoney_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momoney -d momoney_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
